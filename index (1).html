function mascot0(k,m){const mo={h:'<path d="M88 126Q100 140 112 126" stroke="#7a2e2e" stroke-width="3" fill="none" stroke-linecap="round"/>',c:'<path d="M86 124Q100 150 114 124Z" fill="#7a2e2e"/><path d="M92 136Q100 143 108 136Q100 132 92 136Z" fill="#e8647a"/>',s:'<path d="M90 135Q100 124 110 135" stroke="#7a2e2e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M127 112q5 9 0 14q-5-5 0-14z" fill="#7fd3ff"/>'};
const g=k=='g',sk='#e3ad7e',
back=g?'<path d="M36 112Q30 34 100 30Q170 34 164 112Q170 165 150 200H50Q30 165 36 112Z" fill="#1f7a3d"/>':'<path d="M44 92Q36 38 100 32Q164 38 156 92L168 176Q132 152 100 160Q68 152 32 176Z" fill="#fff" stroke="#c9d6cc" stroke-width="2"/>',
body=g?'<path d="M34 220Q34 160 100 156Q166 160 166 220Z" fill="#16365f"/><path d="M84 158L100 182L116 158Z" fill="#e0b94a"/>':'<path d="M34 220Q34 160 100 156Q166 160 166 220Z" fill="#f6f6f0"/><path d="M86 158L100 196L114 158Z" fill="#1f7a3d"/><circle cx="100" cy="176" r="3" fill="#e0b94a"/>',

return `<div class="m3d"><svg viewBox="0 0 200 220" aria-hidden="true"><defs><radialGradient id="fc" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f3c79d"/><stop offset="1" stop-color="${sk}"/></radialGradient></defs>${back}${body}<rect x="90" y="140" width="20" height="22" fill="${sk}"/><ellipse cx="100" cy="98" rx="47" ry="52" fill="url(#fc)"/>${front}<path d="M64 88Q80 78 94 88M106 88Q120 78 136 88" stroke="#2a1a12" stroke-width="4" fill="none" stroke-linecap="round"/><g class="ey"><ellipse cx="80" cy="104" rx="9" ry="12" fill="#1b0f0a"/><circle cx="83" cy="99" r="4" fill="#fff"/><circle cx="77" cy="109" r="2" fill="#fff"/><ellipse cx="120" cy="104" rx="9" ry="12" fill="#1b0f0a"/><circle cx="123" cy="99" r="4" fill="#fff"/><circle cx="117" cy="109" r="2" fill="#fff"/></g><circle cx="68" cy="122" r="7" fill="#ff8a8a" opacity=".35"/><circle cx="132" cy="122" r="7" fill="#ff8a8a" opacity=".35"/>${mo[m]}</svg></div>`}
function loginView(){$('nav').style.display='none';$('main').innerHTML=`<div class="lg"><div class="duo">${mascot('b','h')}${mascot('g','h')}</div><h1>Belajar Bahasa Arab</h1><p class="mu">تَعَلَّمِ الْعَرَبِيَّةَ كُلَّ يَوْمٍ</p><input id="u" placeholder="Username" autocapitalize="off"><input id="p" type="password" placeholder="Kata sandi"><div class="err" id="err"></div><button class="btn w" onclick="login()">Masuk</button><div class="acc"><b>Akun siap pakai</b><br>admin / arab123<br>santri / belajar1<br>tamu / tamu123</div></div>`;$('p').onkeydown=e=>{if(e.key=='Enter')login()}}
function login(){const u=$('u').value.trim().toLowerCase();if(A[u]&&A[u]===$('p').value){me=u;sv('ba_me',u);start()}else $('err').textContent='Username atau kata sandi salah.'}
function start(){S=ld('ba_'+me)||{xp:0,st:0,last:0,done:{}};tb(0)}
function out(){rm('ba_me');loginView()}
function tb(n){$('nav').style.display='flex';[...$('nav').children].forEach((b,i)=>b.className=i==n?'on':'');[home,mf,gm,pf][n]()}

function home(){const t=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
$('main').innerHTML=`<div class="wrap"><div class="st"><span>🔥 ${S.st}</span><span>⭐ ${S.xp} XP</span></div><div class="hero"><div><h2 style="margin:0">Ahlan, ${me}! 👋</h2><p class="mu">${t}</p><div class="ar" style="font-size:20px;color:var(--au)">طَلَبُ الْعِلْمِ فَرِيضَةٌ</div></div>${mascot(S.hc||'b','h')}</div><div class="chat"><div id="cb">Aku ${NM[S.hc||'b']}. Sentuh, geser, atau ketik untuk ngobrol! 😊</div><div class="pl"><button class="pill" onclick="ch(0)">👋 Sapa</button><button class="pill" onclick="ch(1)">📚 Kata hari ini</button><button class="pill" onclick="ch(2)">💪 Semangati</button><button class="pill" onclick="ch(3)">🎯 Tebak kata</button><button class="pill" onclick="ch(4)">📜 Quotes</button></div><div class="pl" id="cq"></div><div class="pl"><button class="pill" onclick="pc('b')">👳 Karim</button><button class="pill" onclick="pc('g')">🧕 Aisyah</button><button class="pill" onclick="pc('u')">🧔 Hamid</button></div><div id="cl"></div><div class="ci"><input id="ci" placeholder="Tanya / terjemahkan: Arab, English, Indonesia" onkeydown="if(event.key=='Enter')send()"><button class="btn" id="cs" onclick="send()">Kirim</button></div></div>`+Object.keys(L).map(k=>{const d=L[k];return `<div class="card" style="border-color:${d.c}"><div class="em">${d.e}</div><div class="gr"><b>${d.n}</b><small>20 soal · 10 mufradat · ${Sn(k).length} mufidah</small></div>${S.done[k+day]?'<span class="ck">✓</span>':''}<button class="btn" onclick="qs('${k}')">Mulai</button></div>`}).join('')+'</div>'}

function pills(cur,fn,items){return `<div class="pl">`+items.map(([v,l])=>`<button class="pill ${v==cur?'on':''}" onclick="${fn}('${v}')">${l}</button>`).join('')+`</div>`}
const lv=Object.keys(L).map(k=>[k,L[k].n]);
function mf(){const k=ml;$('main').innerHTML=`<div class="wrap"><h2>Mufradat Harian</h2>${pills(k,'sml',lv)}<p class="mu"><b>${tw(k).length}</b> mufradat · <b>${Sn(k).length}</b> mufidah hari ini</p>`+tw(k).map(w=>`<div class="row"><div class="ar big">${w[0]}</div><div><b>${w[1]}</b><br><small>${w[2]} · ${w[3]}</small></div><button class="sp" data-t="${w[0]}" onclick="say(this.dataset.t)">🔊</button></div>`).join('')+`<h3>Mufidah (kalimat)</h3>`+Sn(k).map(s=>`<div class="row"><div class="ar" style="font-size:22px;flex:1">${s[0]}</div><small style="flex:1">${s[1]}</small><button class="sp" data-t="${s[0]}" onclick="say(this.dataset.t)">🔊</button></div>`).join('')+'</div>'}
const sml=k=>{ml=k;mf()};

function build(k){const r=R(day*7+k.length),all=W(k),sh=a=>shuf(a,r),
T=[[0,1,'Apa arti kata ini?'],[1,0,'Pilih kata Arab yang tepat'],[2,0,'Choose the Arabic word'],[3,0,'アラビア語を選んでください'],[0,2,'What does it mean?'],[0,3,'日本語の意味は?']],q=[];
sh(tw(k)).concat(sh(tw(k))).slice(0,14).forEach((w,i)=>{const t=T[i%6],a=w[t[1]],d=sh(all.filter(x=>x[t[1]]!=a)).slice(0,3).map(x=>x[t[1]]);q.push({p:w[t[0]],pa:t[0]==0,h:t[2],o:sh([a,...d]),a,oa:t[1]==0})});
const s=Sn(k);sh(s).forEach(x=>{const d=sh(s.filter(y=>y[1]!=x[1])).slice(0,3).map(y=>y[1]);q.push({p:x[0],pa:1,h:'Apa arti kalimat ini?',o:sh([x[1],...d]),a:x[1],oa:0})});
return q.slice(0,20)}
function qs(k){ql=k;Q=build(k);qi=0;hp=5;cor=0;rq()}let ql;
function rq(){const q=Q[qi];sel=-1;ck=false;$('nav').style.display='none';
$('main').innerHTML=`<div class="top"><button class="x" onclick="tb(0)">✕</button><div class="bar"><i style="width:${qi/Q.length*100}%"></i></div><b>❤️ ${hp}</b></div><div class="qb"><div class="tk">${mascot(qi%2?'g':'b','h')}<p class="mu bub">${qi+1}/${Q.length} · ${q.h}</p></div><div class="pr ${q.pa?'ar':''}">${q.p}${q.pa?` <button class="sp" data-t="${q.p}" onclick="say(this.dataset.t)">🔊</button>`:''}</div>`+q.o.map((o,i)=>`<button class="o ${q.oa?'ar':''}" onclick="pk(${i})">${o}</button>`).join('')+`</div><div id="ft"><div><button class="btn w" id="fb" disabled onclick="cx()">Periksa</button></div></div>`}
function pk(i){if(ck)return;sel=i;[...document.querySelectorAll('.o')].forEach((b,j)=>b.classList.toggle('s',j==i));$('fb').disabled=false}
function cx(){const q=Q[qi];if(ck){if(hp<=0||++qi>=Q.length)return fin();return rq()}
ck=true;const bs=[...document.querySelectorAll('.o')],good=q.o[sel]==q.a;bs.forEach((b,j)=>{b.classList.remove('s');if(q.o[j]==q.a)b.classList.add('ok')});
if(good)cor++;else{hp--;bs[sel].classList.add('no')}{const tk=document.querySelector('.tk .m3d');if(tk)tk.outerHTML=mascot(qi%2?'g':'b',good?'c':'s')}
$('ft').className=good?'ok':'no';$('ft').firstChild.innerHTML=`<b>${good?'Benar! 🎉':'Kurang tepat. Jawaban: '+q.a}</b><button class="btn w ${good?'':'rd'}" id="fb" onclick="cx()">Lanjut</button>`}
function fin(){const xp=cor*5,win=hp>0;if(win){S.xp+=xp;S.done[ql+day]=1;if(S.last!=day){S.st=S.last==day-1?S.st+1:1;S.last=day}save()}
$('ft')&&$('ft').remove();$('main').innerHTML=`<div class="fin"><div class="duo">${mascot('b',win?'c':'s')}${mascot('g',win?'c':'s')}</div><h2>${win?'Pelajaran selesai!':'Nyawa habis'}</h2><p>Benar ${cor} dari ${Q.length}${win?` · +${xp} XP`:''}</p><button class="btn w" onclick="tb(0)">Selesai</button><br><br><button class="btn bl w" onclick="qs(ql)">Ulangi</button></div>`}

function gm(){$('main').innerHTML=`<div class="wrap"><h2>Game Mencocokkan</h2><p class="mu">Cocokkan kata Arab dengan artinya.</p>${pills(gl,'sgl',lv)}${pills(gx,'sgx',[[1,'Indonesia'],[2,'English'],[3,'日本語']])}<button class="btn w" onclick="gstart()">Main</button><div id="gb"></div></div>`}
const sgl=k=>{gl=k;gm()},sgx=v=>{gx=+v;gm()};
function gstart(){const ws=shuf(W(gl)).slice(0,5);let s={l:null,r:null},ok=0;
const Ls=ws.map((w,j)=>[j,w[0]]),Rs=shuf(ws.map((w,j)=>[j,w[gx]]));
$('gb').innerHTML=`<div class="gg"><div class="gc">${Ls.map(x=>`<button class="m ar" data-s="l" data-j="${x[0]}">${x[1]}</button>`).join('')}</div><div class="gc">${Rs.map(x=>`<button class="m" data-s="r" data-j="${x[0]}">${x[1]}</button>`).join('')}</div></div><p class="ctr mu" id="gm">Pilih satu kata di kiri dan pasangannya di kanan.</p>`;
$('gb').onclick=e=>{const t=e.target.closest('.m');if(!t||t.disabled)return;const d=t.dataset.s;if(s[d])s[d].classList.remove('s');s[d]=t;t.classList.add('s');if(d=='l')say(ws[+t.dataset.j][0]);
if(s.l&&s.r){const a=s.l,b=s.r;s={l:null,r:null};if(a.dataset.j==b.dataset.j){[a,b].forEach(x=>{x.className+=' ok';x.classList.remove('s');x.disabled=true});if(++ok==5){S.xp+=10;save();$('gm').innerHTML='<b>🎉 Hebat! +10 XP</b>'}}else{[a,b].forEach(x=>x.classList.add('bad'));setTimeout(()=>[a,b].forEach(x=>x.classList.remove('bad','s')),500)}}}}

function pf(){const u=location.href;$('main').innerHTML=`<div class="wrap ctr">${mascot(me=='tamu'?'g':'b','h')}<h2>${me}</h2><div class="st" style="justify-content:center"><span>🔥 ${S.st} hari</span><span>⭐ ${S.xp} XP</span></div><h3>Barcode akses</h3><p class="mu">Pindai untuk membuka aplikasi ini.</p><div id="qr"></div><p><small style="word-break:break-all">${u}</small></p><button class="btn bl w" onclick="try{navigator.clipboard.writeText(location.href)}catch(e){}">Salin tautan</button><br><br><button class="btn rd w" onclick="out()">Keluar</button></div>`;
try{new QRCode($('qr'),{text:u,width:200,height:200,colorDark:'#000000',colorLight:'#ffffff'})}catch(e){$('qr').textContent='QR belum termuat, gunakan tautan di bawah.'}}

(function(){const m=ld('ba_me');if(m&&A[m]){me=m;start()}else loginView()})();
</script></body></html>
